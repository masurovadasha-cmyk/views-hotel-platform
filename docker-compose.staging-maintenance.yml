# Apply explicitly with the verified base topology. Nothing auto-starts this profile.
# One immutable image is shared by Core and the maintenance process.
services:
  core:
    image: ${VIEWS_STAGING_CORE_IMAGE:?An approved immutable Core image is required}
    build: !reset null
    labels:
      io.views.environment: staging
      io.views.release: ${VIEWS_STAGING_RELEASE_SHA:?An approved source SHA is required}
  payme-maintenance:
    image: ${VIEWS_STAGING_CORE_IMAGE:?An approved immutable Core image is required}
    profiles: [maintenance]
    pull_policy: never
    restart: "no"
    init: true
    command: [node, /app/ops/staging-maintenance.mjs, --watch, --ack=STAGING_MAINTENANCE_ONLY]
    environment:
      NODE_ENV: production
      VIEWS_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?Restricted staging runtime DB is required}
      GUEST_AUTH_RATE_LIMIT_SECRET: ${GUEST_AUTH_RATE_LIMIT_SECRET:?Required}
      TRUSTED_PROXY_MODE: cloudflare_tunnel
      VIEWS_TRUSTED_PROXY_CIDRS_JSON: '["172.30.0.2/32","172.30.0.4/32"]'
      VIEWS_INTERNAL_SERVICE_AUTH_MODES_JSON:
      VIEWS_INTERNAL_SERVICE_PUBLIC_KEY_REFS_JSON:
      VIEWS_INTERNAL_PAGES_BFF_PUBLIC_KEY:
      VIEWS_INTERNAL_ANALYTICS_CRON_PUBLIC_KEY:
      VIEWS_PAYME_SANDBOX_ENABLED: ${VIEWS_PAYME_SANDBOX_ENABLED:-false}
      VIEWS_PAYME_MODE: sandbox
      VIEWS_PAYME_ORGANIZATION_ID:
      VIEWS_PAYME_MERCHANT_ID:
      VIEWS_PAYME_MERCHANT_LOGIN:
      VIEWS_PAYME_TEST_KEY:
      VIEWS_STAGING_MAINTENANCE_ENABLED: ${VIEWS_STAGING_MAINTENANCE_ENABLED:-false}
      VIEWS_STAGING_COST_ACK: ${VIEWS_STAGING_COST_ACK:-NOT_APPROVED}
      VIEWS_STAGING_RELEASE_SHA: ${VIEWS_STAGING_RELEASE_SHA:?Required}
      VIEWS_STAGING_REPORT_DIR: /var/lib/views-maintenance
      VIEWS_STAGING_MAINTENANCE_INTERVAL_SECONDS: "300"
      VIEWS_STAGING_MAINTENANCE_TIMEOUT_SECONDS: "45"
      VIEWS_STAGING_MAINTENANCE_LIMIT: "50"
    labels:
      io.views.environment: staging
      io.views.release: ${VIEWS_STAGING_RELEASE_SHA:?Required}
    networks: [core_data]
    volumes:
      - views_staging_maintenance:/var/lib/views-maintenance
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, node, /app/ops/staging-maintenance.mjs, --healthcheck]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 60s
volumes:
  views_staging_maintenance:
