# VIEWS Stage 7.17 controlled HTTPS egress relay.
# Core may only CONNECT to explicitly allowlisted DNS destinations on 443.
http_port 3128

acl views_core src 172.31.0.2/32
acl SSL_ports port 443
acl CONNECT method CONNECT
acl views_allowed dstdomain "/etc/squid/allowed-domains.txt"

http_access deny !SSL_ports
http_access deny CONNECT !SSL_ports
http_access allow views_core CONNECT views_allowed
http_access deny all

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
access_log stdio:/dev/stdout
cache_log /dev/stderr
logfile_rotate 0
via off
forwarded_for delete
