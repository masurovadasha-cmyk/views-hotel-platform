# VIEWS controlled relay: destination checks are evaluated before CONNECT allow.
http_port 3128
hosts_file /etc/hosts
acl views_core src 172.31.0.2/32
acl SSL_ports port 443
acl CONNECT method CONNECT
# -n prevents reverse DNS from turning an IP literal into an approved name.
acl views_allowed dstdomain -n "/etc/squid/allowed-domains.txt"
acl views_forbidden_v4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl views_forbidden_v6 dst ::/128 ::1/128 ::ffff:0:0/96 64:ff9b::/96 64:ff9b:1::/48 100::/64 2001::/32 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8
http_access deny !views_core
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny !views_allowed
http_access deny views_forbidden_v4
http_access deny views_forbidden_v6
http_access allow views_core CONNECT views_allowed
http_access deny all
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
logfile_rotate 0
via off
forwarded_for delete
