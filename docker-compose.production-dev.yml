services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: views
      POSTGRES_USER: views
      POSTGRES_PASSWORD: views_dev_only
    ports:
      - "5432:5432"
    volumes:
      - views_pg:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U views -d views"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    ports:
      - "6379:6379"
    volumes:
      - views_redis:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  views_pg:
  views_redis:
