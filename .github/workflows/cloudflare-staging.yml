name: VIEWS Cloudflare Staging
on:
  workflow_dispatch:
  push:
    branches: ["staging/master-reference-v1"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: views-cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:review
      - name: Check deployment credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment NOT executed: repository/environment credentials are absent. The separately connected Workers Builds integration may deploy this same commit." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy existing review Worker
        if: steps.credentials.outputs.available == 'true'
        run: npx --yes wrangler@4.148.0 deploy --config wrangler.toml
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-review-build
          path: dist
          if-no-files-found: error
