name: VIEWS Cloudflare Staging
on:
  workflow_dispatch:
  push:
    branches: ["staging/master-reference-v1"]
    paths:
      - "functions/**"
      - "migrations/**"
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/cloudflare-staging.yml"

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: views-cloudflare-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply views-staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Pages staging
        run: npx wrangler pages deploy dist --project-name=views-hotel-platform --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
