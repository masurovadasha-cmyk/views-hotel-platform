name: VIEWS D1 Schema
on:
  push:
    branches: [main, "staging/**", "stage4/**", "stage5/**", "stage6/**"]
    paths:
      - "migrations/**"
      - ".github/workflows/schema.yml"
  pull_request:
    branches: [main, "staging/master-reference-v1"]
    paths:
      - "migrations/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all D1-compatible migrations
        run: |
          set -e
          rm -f /tmp/views.db
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            sqlite3 /tmp/views.db < "$migration"
          done
          sqlite3 /tmp/views.db ".tables"
          sqlite3 /tmp/views.db "PRAGMA foreign_key_check;"
          sqlite3 /tmp/views.db "SELECT id,name,slug FROM organizations;"
          sqlite3 /tmp/views.db "SELECT id,name,city FROM properties;"
          sqlite3 /tmp/views.db "SELECT provider,status FROM integrations ORDER BY provider;"
