name: V Market catalog acceptance
on:
  push:
    branches:
      - stage7/vmarket-catalog-adapter-20261117
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify catalog integrity
        run: node scripts/vmarket-catalog.acceptance.cjs
