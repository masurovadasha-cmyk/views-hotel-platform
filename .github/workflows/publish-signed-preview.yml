name: Publish signed VIEWS Preview
on:
  push:
    branches: ['release-artifacts/v0.11.0-preview']
    paths: ['release-artifacts/**', '.github/workflows/publish-signed-preview.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable public APK
        working-directory: release-artifacts/v0.11.0-preview
        run: |
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum VIEWS-0.11.0-preview.apk | cut -d ' ' -f 1)" = 2c47a0c8b8636602a7497ff364b6e3a375c3d329fa73146c395920a4d57ae2a8
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$SIGNER"
          test -n "$SIGNER"
          "$SIGNER" verify --verbose --print-certs VIEWS-0.11.0-preview.apk | tee signature.txt
          test "${PIPESTATUS[0]}" = 0
          grep -F 'Signer #1 certificate SHA-256 digest: 3a973f0de0333ced89769ddfdae476fe826da605910c952212bbfd1c8179e052' signature.txt
          python3 - <<'PY'
          import json, zipfile, hashlib
          from pathlib import Path
          proof=json.loads(Path('signing-evidence.json').read_text())
          assert proof['signatureVerified'] is True and proof['productionEnabled'] is False
          assert proof['apkSha256']==hashlib.sha256(Path('VIEWS-0.11.0-preview.apk').read_bytes()).hexdigest()
          with zipfile.ZipFile('VIEWS-0.11.0-preview.apk') as apk:
              release=json.loads(apk.read('assets/www/release.json'))
          assert release['sourceCommit']==proof['sourceCommit']=='bdd6d15828e40d8e831b05cc2352670289ed3ebb'
          assert release['sourceDirty'] is False and release['emailConnected'] is False and release['corePublic'] is False
          assert release['androidVersionCode']==1100001
          assert release['version']=='0.11.0-preview' and release['androidApplicationId']=='uz.views.preview'
          PY
      - name: Upload and publish requested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-artifacts/v0.11.0-preview
        run: |
          gh release upload v0.11.0-preview VIEWS-0.11.0-preview.apk SHA256SUMS.txt signing-evidence.json
          gh release edit v0.11.0-preview --draft=false --prerelease
