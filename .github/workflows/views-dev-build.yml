name: VIEWS Development Web and Android
on:
  push:
    branches:
      - feat/views-service-core-stage-2-8
    paths:
      - 'services/service-core/public/**'
      - 'android/**'
      - '.github/workflows/views-dev-build.yml'
  workflow_dispatch:
jobs:
  web-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web snapshot
        run: |
          mkdir -p dist/views-web
          cp services/service-core/public/{guest.html,guest.js,crm.html,crm.js,crm.css,staff.html,staff.js,staff.css,finance.html,finance.js,views-client.js} dist/views-web/
          printf '%s\n' "VIEWS development frontend snapshot" "Commit: ${GITHUB_SHA}" "This snapshot requires the PostgreSQL API and authentication." "Do not publish these files alone as a working production app." > dist/views-web/README.txt
          python3 - <<'PY'
          import json,os
          with open('dist/views-web/build.json','w') as f:
              json.dump({'commit':os.environ['GITHUB_SHA'],'kind':'development-web-snapshot','backendRequired':True,'livePayments':False},f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: views-web-development
          path: dist/views-web/
          if-no-files-found: error
          retention-days: 14
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: views-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
