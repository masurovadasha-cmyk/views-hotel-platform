name: VIEWS Service Core
on:
  push:
    paths:
      - 'services/service-core/**'
      - 'db/migrations/**'
      - '.github/workflows/views-service-core.yml'
  pull_request:
    paths:
      - 'services/service-core/**'
      - 'db/migrations/**'
      - '.github/workflows/views-service-core.yml'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/service-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/server.mjs
      - run: node --check src/postgres.mjs
      - run: node --check src/auth.mjs
      - run: node --check src/db-server.mjs
      - run: node --check src/order-status.mjs
      - run: node --check src/pms-sync.mjs
      - run: node --check src/payment-intents.mjs
      - run: node --check src/payment-events.mjs
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: views_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for file in db/migrations/0001_service_core.sql db/migrations/0002_inventory_reservations.sql db/migrations/0003_order_items.sql db/migrations/0004_property_access.sql db/migrations/0005_order_audit.sql db/migrations/0006_order_ownership.sql db/migrations/0007_market_pricing.sql db/migrations/0008_guest_booking_access.sql db/migrations/0008_guest_stays.sql db/migrations/0009_guest_bookings.sql db/migrations/0010_booking_schema_compat.sql db/migrations/0011_pms_event_inbox.sql db/migrations/0012_payment_intents.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d views_test -f "$file"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: services/service-core
        run: npm install --no-audit --no-fund
      - name: Create restricted application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d views_test -c "CREATE ROLE views_test_app LOGIN PASSWORD 'views_test_app_password' NOBYPASSRLS;"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d views_test -c "GRANT USAGE ON SCHEMA public TO views_test_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO views_test_app;"
      - name: PostgreSQL integration test
        working-directory: services/service-core
        env:
          TEST_DATABASE_URL: postgresql://views_test_app:views_test_app_password@localhost:5432/views_test
        run: |
          export VIEWS_AUTH_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          node --test test/integration.pg.mjs test/integration.http.pg.mjs test/integration.stays.pg.mjs test/integration.bookings.pg.mjs test/integration.pms.pg.mjs test/integration.payments.pg.mjs test/integration.payment-events.pg.mjs
