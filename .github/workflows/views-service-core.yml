name: VIEWS Service Core
on:
  push:
    paths:
      - 'services/service-core/**'
      - 'db/migrations/**'
      - 'android/**'
      - '.github/workflows/views-service-core.yml'
  pull_request:
    paths:
      - 'services/service-core/**'
      - 'db/migrations/**'
      - 'android/**'
      - '.github/workflows/views-service-core.yml'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/service-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/server.mjs
      - run: node --check src/postgres.mjs
      - run: node --check src/auth.mjs
      - run: node --check src/db-server.mjs
      - run: node --check src/order-status.mjs
      - run: node --check src/payment-ledger.mjs
      - run: node --check src/payment-domain.mjs
      - run: node --check src/pms-sync.mjs
      - run: node --check src/payment-intents.mjs
      - run: node --check src/payment-events.mjs
      - run: node --check src/payment-provider-contract.mjs
      - run: node --check src/refunds.mjs
      - run: node --check src/dispatch.mjs
      - run: node --check src/task-compensation.mjs
      - run: node --check public/staff.js
      - run: node --check src/cleaning-laundry.mjs
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: views_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for file in db/migrations/0001_service_core.sql db/migrations/0002_inventory_reservations.sql db/migrations/0003_order_items.sql db/migrations/0004_property_access.sql db/migrations/0005_order_audit.sql db/migrations/0006_order_ownership.sql db/migrations/0007_market_pricing.sql db/migrations/0008_guest_booking_access.sql db/migrations/0009_payment_ledger.sql db/migrations/0008_guest_stays.sql db/migrations/0009_guest_bookings.sql db/migrations/0010_booking_schema_compat.sql db/migrations/0011_pms_event_inbox.sql db/migrations/0012_payment_intents.sql db/migrations/0013_payment_ledger_refunds.sql db/migrations/0014_dispatch_tasks.sql db/migrations/0015_cleaning_laundry.sql db/migrations/0016_task_compensation.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d views_test -f "$file"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: services/service-core
        run: npm install --no-audit --no-fund
      - name: Create restricted application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d views_test -c "CREATE ROLE views_test_app LOGIN PASSWORD 'views_test_app_password' NOBYPASSRLS;"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d views_test -c "GRANT USAGE ON SCHEMA public TO views_test_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO views_test_app;"
      - name: PostgreSQL integration test
        working-directory: services/service-core
        env:
          TEST_DATABASE_URL: postgresql://views_test_app:views_test_app_password@localhost:5432/views_test
        run: |
          export VIEWS_AUTH_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          node --test test/integration.pg.mjs test/integration.http.pg.mjs test/integration.stays.pg.mjs test/integration.bookings.pg.mjs test/integration.pms.pg.mjs test/integration.payments.pg.mjs test/integration.payment-events.pg.mjs test/integration.refunds.pg.mjs test/integration.cleaning-laundry.pg.mjs
  web-snapshot:
    needs: [node-tests, postgres-migrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web snapshot
        run: |
          mkdir -p dist/views-web
          cp services/service-core/public/{guest.html,guest.js,crm.html,crm.js,crm.css,staff.html,staff.js,staff.css,finance.html,finance.js,views-client.js} dist/views-web/
          printf '%s\n' "VIEWS development frontend snapshot" "Commit: ${GITHUB_SHA}" "This snapshot requires the PostgreSQL API and authentication." "Do not publish these files alone as a working production app." > dist/views-web/README.txt
          python3 - <<'PY'
          import json,os
          with open('dist/views-web/build.json','w') as f:
              json.dump({'commit':os.environ['GITHUB_SHA'],'kind':'development-web-snapshot','backendRequired':True,'livePayments':False},f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: views-web-development
          path: dist/views-web/
          if-no-files-found: error
          retention-days: 14
  android-debug:
    needs: [node-tests, postgres-migrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: views-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
