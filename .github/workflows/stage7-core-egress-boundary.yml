name: Stage 7.16 Core Egress Boundary

on:
  push:
    branches: ["stage7/core-egress-default-deny-v1"]
    paths:
      - "apps/api/**"
      - "docker-compose.core-tunnel*.yml"
      - "scripts/core-*gate*.mjs"
      - "scripts/core-egress-probe*.mjs"
      - "scripts/stage7-core-egress-proof.sh"
      - ".github/workflows/stage7-core-egress-boundary.yml"
  pull_request:
    branches: ["stage7/core-origin-isolation-v1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-16-core-egress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: proof_owner_password_2026
      DATABASE_URL: postgresql://views_app:views_app_proof_2026@postgres:5432/views
      GUEST_AUTH_RATE_LIMIT_SECRET: stage7-16-proof-rate-limit-secret-material-2026
      VIEWS_INTERNAL_SERVICE_AUTH_MODES_JSON: '{"pages-bff":"signed_only"}'
      CLOUDFLARE_TUNNEL_TOKEN: proof-unused
      VIEWS_EGRESS_PROOF_ACK: DISPOSABLE_DATABASE_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing TypeScript parser and test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check policy and probe regressions
        run: npm test -- scripts/core-network-primitive-gate.test.mjs scripts/core-egress-probe.test.mjs
      - name: Generate ephemeral Ed25519 verification configuration
        shell: bash
        run: |
          node <<'NODE'
          const {generateKeyPairSync}=require("node:crypto");
          const fs=require("node:fs");
          const {publicKey}=generateKeyPairSync("ed25519");
          const pem=publicKey.export({format:"pem",type:"spki"}).toString().trim();
          const activatedAt=new Date(Date.now()-60000).toISOString();
          const rotateBy=new Date(Date.now()+86400000).toISOString();
          const refs={"pages-bff":[{kid:"stage7-16-proof",ref:"VIEWS_INTERNAL_PAGES_BFF_PUBLIC_KEY",activatedAt,rotateBy}]};
          fs.appendFileSync(process.env.GITHUB_ENV,
            "VIEWS_INTERNAL_PAGES_BFF_PUBLIC_KEY<<VIEWS_STAGE7_KEY\n"+pem+"\nVIEWS_STAGE7_KEY\n"+
            "VIEWS_INTERNAL_SERVICE_PUBLIC_KEY_REFS_JSON="+JSON.stringify(refs)+"\n");
          NODE
      - name: Prove measured Core runtime isolation
        run: bash scripts/stage7-core-egress-proof.sh
      - name: Publish egress evidence
        if: always()
        shell: bash
        run: |
          echo "### Stage 7.16 measured egress proof" >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/stage7.16-core-egress-proof.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/stage7.16-core-egress-proof.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Evidence unavailable; no isolation success is claimed." >> "$GITHUB_STEP_SUMMARY"
          fi
