name: VIEWS Unified Calendar
on:
  push:
    branches: ['review/unified-calendar-20261010']
permissions:
  contents: read
concurrency:
  group: views-unified-calendar
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - name: Export reproducible frontend workspace for review
        run: |
          mkdir -p review-output
          tar -czf review-output/calendar-workspace.tgz src functions scripts package.json tsconfig.json vite.config.ts vitest.config.ts index.html node_modules
          printf '%s\n' "$GITHUB_SHA" > review-output/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-verification
          path: review-output/
          retention-days: 2
