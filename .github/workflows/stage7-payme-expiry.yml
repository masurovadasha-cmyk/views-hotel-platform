name: Stage 7.21 Payme Expiry Maintenance
on:
  push:
    branches: ['stage7/payme-expiry-maintenance-v1']
  pull_request:
    branches: ['stage7/payme-sandbox-adapter-v1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage7-21-payme-expiry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      POSTGRES_PASSWORD: proof_owner_password_2026
      DATABASE_URL: postgresql://views_app:views_app_proof_2026@postgres:5432/views
      GUEST_AUTH_RATE_LIMIT_SECRET: stage7-21-fixture-only-rate-limit-secret-material
      CLOUDFLARE_TUNNEL_TOKEN: proof-unused
      VIEWS_PAYME_EXPIRY_PROOF: 'true'
      VIEWS_PAYME_PROOF_OUTPUT: /tmp/stage7.21-payme-expiry-proof.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing API test dependencies
        working-directory: apps/api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck complete Core
        working-directory: apps/api
        run: npm run typecheck
      - name: Validate fixture entry points
        run: |
          node --check scripts/payme-lifecycle.integration.cjs
          node --check scripts/payme-expiry.integration.cjs
          bash -n scripts/stage7-provider-egress-audit-proof.sh
          bash -n scripts/stage7-payme-sandbox-proof.sh
      - name: Run legacy audit proof with actual forwarded SQL
        run: bash scripts/stage7-provider-egress-audit-proof.sh
      - name: Run payment lifecycle and real expiry worker scenarios
        run: bash scripts/stage7-payme-sandbox-proof.sh
      - name: Enforce current-run worker evidence
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('/tmp/stage7.21-payme-expiry-proof.json','utf8'));
          if(r.result!=='pass'||r.stage!=='7.21'||r.checkCount<26||!r.expiryWorkerVerified||r.sourceCommit!==process.env.GITHUB_SHA)
            throw Error('MISSING_EXPIRY_WORKER_EVIDENCE');
          console.log(JSON.stringify(r,null,2));
          NODE
      - name: Preserve exact source for evidence review
        if: always()
        run: git archive --format=zip HEAD -o /tmp/views-stage7.21-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payme-expiry-maintenance-evidence
          path: |
            /tmp/stage7.19-provider-egress-audit-proof.json
            /tmp/stage7.21-payme-expiry-proof.json
            /tmp/views-stage7.21-source.zip
          if-no-files-found: error
