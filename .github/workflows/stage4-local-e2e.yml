name: VIEWS Stage 4 Local E2E

on:
  push:
    branches: ["staging/**", "stage4/**", "stage5/**", "stage6/**"]
    paths:
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "functions/**"
      - "migrations/**"
      - "src/**"
      - "scripts/stage4-local-e2e.sh"
      - "scripts/stage4-remote-smoke.sh"
      - "wrangler.local.toml"
      - "package.json"
      - ".github/workflows/stage4-local-e2e.yml"
  pull_request:
    branches: [main, "staging/master-reference-v1"]
    paths:
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "functions/**"
      - "migrations/**"
      - "src/**"
      - "scripts/stage4-local-e2e.sh"
      - "scripts/stage4-remote-smoke.sh"
      - "wrangler.local.toml"

permissions:
  contents: read

concurrency:
  group: views-stage4-local-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Validate remote smoke shell
        run: bash -n scripts/stage4-remote-smoke.sh

      - name: Build Pages assets
        run: npm run build

      - name: Run local Pages + D1 golden flow
        run: bash scripts/stage4-local-e2e.sh
