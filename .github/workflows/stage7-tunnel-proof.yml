name: Stage 7.15 Tunnel Staging Proof

on:
  push:
    branches: ["stage7/core-origin-isolation-v1"]
    paths:
      - "apps/api/**"
      - "infra/postgres/**"
      - "docker-compose.core-tunnel.yml"
      - "docker-compose.core-tunnel-proof.yml"
      - "scripts/core-origin-isolation-gate.mjs"
      - "scripts/stage7-tunnel-proof.sh"
      - ".github/workflows/stage7-tunnel-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-15-tunnel-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: proof_owner_password_2026
      DATABASE_URL: postgresql://views_app:views_app_proof_2026@postgres:5432/views
      GUEST_AUTH_RATE_LIMIT_SECRET: stage7-15-proof-rate-limit-secret-material-2026
      VIEWS_INTERNAL_SERVICE_AUTH_MODES_JSON: '{"pages-bff":"signed_only"}'
      VIEWS_INTERNAL_SERVICE_PUBLIC_KEY_REFS_JSON: '{"pages-bff":[{"kid":"stage7-15-proof","ref":"VIEWS_INTERNAL_PAGES_BFF_PUBLIC_KEY","activatedAt":"2026-10-06T00:00:00.000Z","rotateBy":"2027-01-04T00:00:00.000Z"}]}'
      CLOUDFLARE_TUNNEL_TOKEN: proof-unused
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate ephemeral Ed25519 service verification key
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {generateKeyPairSync}=require("node:crypto");
          const {publicKey}=generateKeyPairSync("ed25519");
          const pem=publicKey.export({format:"pem",type:"spki"}).toString().trim();
          const fs=require("node:fs");
          fs.appendFileSync(process.env.GITHUB_ENV,
            "VIEWS_INTERNAL_PAGES_BFF_PUBLIC_KEY<<VIEWS_STAGE7_KEY\n"+
            pem+"\nVIEWS_STAGE7_KEY\n"
          );
          NODE

      - name: Run real Cloudflare tunnel isolation proof
        run: bash scripts/stage7-tunnel-proof.sh

      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          echo "### Stage 7.15 tunnel proof" >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/stage7.15-tunnel-proof.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/stage7.15-tunnel-proof.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Proof did not reach the final evidence step. Inspect job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
