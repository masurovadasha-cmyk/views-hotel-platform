name: VIEWS CI
on:
  push:
    branches: [main, "staging/**", "stage4/**", "stage5/**", "stage6/**", "stage7/**"]
  pull_request:
    branches: [main, "staging/master-reference-v1"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - name: Verify immutable migrations and clean versus upgrade schemas
        run: |
          node --test scripts/migration-manifest.acceptance.cjs
          node scripts/migration-upgrade-proof.cjs
      - name: Verify mobile build profile isolation
        run: |
          node scripts/generate-native-tokens.cjs --check
          node --test scripts/mobile-config.acceptance.cjs scripts/mobile-dependencies.acceptance.cjs scripts/mobile-preferences.acceptance.cjs
      - run: pnpm workspace:check
        env:
          EXPO_NO_TELEMETRY: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Verify distinct mobile profile bundles
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_APP_MODE: staff
        run: |
          pnpm --filter @views/mobile exec expo export --platform android --max-workers 2 --clear --output-dir /tmp/views-staff-export
          node scripts/mobile-bundle-proof.cjs apps/mobile/dist /tmp/views-staff-export
      - name: Verify Next guest and host SSR shell
        run: node scripts/web-shell.http.cjs
      - name: Build frozen production API image
        run: docker build -f apps/api/Dockerfile -t views-api:ci .
      - name: Verify non-root API container and disposable database readiness
        run: node scripts/api-container-smoke.cjs views-api:ci
      - name: Verify Core with disposable PostgreSQL and loopback SMTP
        run: pnpm workspace:test:core
        env:
          VIEWS_GUEST_EMAIL_HTTP_PROOF: "true"
      - run: node --test scripts/staff-mail.acceptance.cjs
      - name: Enforce Core network primitive boundary
        run: npm run security:core-network-primitives
      - name: Enforce production egress domain policy
        run: npm run security:egress-domain-policy
      - name: Validate Stage 7 shell proofs
        run: |
          bash -n scripts/stage7-tunnel-proof.sh
          bash -n scripts/stage7-named-tunnel-failover-proof.sh
          bash -n scripts/stage7-tunnel-slo-check.sh
          bash -n scripts/stage7-external-synthetic-check.sh
          bash -n scripts/stage7-core-egress-proof.sh
          bash -n scripts/stage7-egress-relay-proof.sh
      - name: Install browser for Canva interface regression
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify standalone CRM shell
        run: node scripts/crm-shell.browser.mjs
      - name: Verify Canva navigation, themes, focus and sample contrast
        run: node scripts/canva-design.browser.cjs
      - name: Verify Canva Core surfaces with read-only HTTP fixtures
        run: node scripts/canva-core-surfaces.browser.cjs
      - name: Verify service catalogue compatibility and disconnected directions
        run: node scripts/service-catalog.browser.cjs
