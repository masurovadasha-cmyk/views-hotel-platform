name: Trusted Proxy CIDR Drift

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-proxy-cidr-drift
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VIEWS_TRUSTED_PROXY_CIDRS_JSON: ${{ vars.VIEWS_TRUSTED_PROXY_CIDRS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require production trusted-proxy allowlist
        shell: bash
        run: |
          if [ -z "$VIEWS_TRUSTED_PROXY_CIDRS_JSON" ]; then
            echo "::error::Repository variable VIEWS_TRUSTED_PROXY_CIDRS_JSON is required."
            exit 1
          fi
      - name: Compare configured CIDRs with Cloudflare published ranges
        run: node scripts/trusted-proxy-cidr-gate.mjs
