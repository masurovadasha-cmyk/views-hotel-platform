<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIEWS — Market & CRM Demo</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#1a1d24;background:#f6f5f2}body{margin:0;padding:24px;max-width:1100px;margin-inline:auto}h1{letter-spacing:.12em}nav{display:flex;gap:12px;margin:24px 0}button{border:1px solid #a88b58;background:#a88b58;color:#1a1d24;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:600}button.secondary{background:white}button:disabled{opacity:.5}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 3px 18px #0000000b}.item{border-bottom:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.actions{display:flex;gap:8px;align-items:center}output{font-weight:700}small{color:#64666b}#notice{min-height:24px}@media(max-width:720px){main{grid-template-columns:1fr}body{padding:12px}}</style></head><body><h1>VIEWS</h1><p>Hotel & Apartments · Локальная демонстрация без реальных платежей и склада</p><main><section class="panel"><h2>Минимаркет</h2><p>NRG U-Tower · №235</p><div id="catalog"></div><p>Товары: <output id="subtotal">0 UZS</output></p><p>Доставка: 15 000 UZS</p><h3>Итого: <output id="total">0 UZS</output></h3><button id="checkout">Оформить демо-заказ</button><p id="notice" role="status"></p></section><section class="panel"><h2>Диспетчерская CRM</h2><button class="secondary" id="refresh">Обновить заказы</button><div id="orders"></div></section></main><script src="/app.js" defer></script></body></html>
